name: Update main languages

on:
  schedule:
    - cron: '0 8 * * *'   # cada día a las 08:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch top languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const username = 'ErickNuup';
          const url = `https://api.github.com/users/${username}/repos?per_page=100`;

          function requestJson(url) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/vnd.github+json',
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
                }
              }, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 400) {
                    reject(new Error(`GitHub API error: ${res.statusCode} - ${data}`));
                    return;
                  }
                  try {
                    resolve(JSON.parse(data));
                  } catch (err) {
                    reject(err);
                  }
                });
              });
              req.on('error', reject);
            });
          }

          async function run() {
            const repos = await requestJson(url);
            const langMap = new Map();

            for (const repo of repos) {
              if (!repo.language) continue;
              langMap.set(repo.language, (langMap.get(repo.language) || 0) + 1);
            }

            const sorted = [...langMap.entries()].sort((a, b) => b[1] - a[1]);
            const top = sorted.slice(0, 6).map(([lang]) => lang);
            const result = top.join(' · ');

            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const markerStart = '<!-- LANGUAGES:START -->';
            const markerEnd = '<!-- LANGUAGES:END -->';

            const block = `${markerStart}\n${result}\n${markerEnd}`;

            if (readme.includes(markerStart) && readme.includes(markerEnd)) {
              const updated = readme.replace(
                new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`),
                block
              );
              fs.writeFileSync(readmePath, updated);
            } else {
              const newContent = `${readme}\n\n${block}\n`;
              fs.writeFileSync(readmePath, newContent);
            }
          }

          run().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add README.md
          git commit -m "Update main languages"
          git push
